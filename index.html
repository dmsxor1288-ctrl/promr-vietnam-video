<meta property="og:title" content="ProMR · Xác thực từng lượt thăm">
<meta property="og:image" content="https://dmsxor1288-ctrl.github.io/promr-vietnam-video/poster.jpg">
<meta property="og:description" content="Tiền thưởng thất thoát vì lượt thăm giả, ProMR chặn lại.">
<style>
html,body{height:100%;margin:0}
body{background:#fff;color:#141B3D;font-family:"Segoe UI","Be Vietnam Pro",Roboto,"Helvetica Neue",Arial,sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-sizing:border-box;
 padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
video{display:block;height:min(82vh,calc((100vw - 32px)*16/9));max-width:100%;aspect-ratio:9/16;border-radius:18px;background:#000;box-shadow:0 12px 40px rgba(20,27,61,.15)}
h1{font-size:17px;margin:0;font-weight:800;text-align:center}
h1 span{color:#F04E23}
p{margin:0;font-size:13px;color:#6B7186;text-align:center}
.wrap{position:relative;max-width:100%}
#snd{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);border:0;background:#F04E23;color:#fff;font:700 16px/1 inherit;font-family:inherit;padding:13px 22px;border-radius:30px;box-shadow:0 6px 18px rgba(240,78,35,.4);cursor:pointer}
#snd:focus-visible{outline:3px solid #141B3D;outline-offset:2px}
</style></head><body>
<h1><span>ProMR</span> · Xác thực từng lượt thăm</h1>
<div class="wrap"><video id="v" src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline controls preload="auto"></video>
<button id="snd" type="button">🔊 Bật âm thanh</button></div>
<script>
const v=document.getElementById('v'),b=document.getElementById('snd');
b.onclick=()=>{v.muted=false;v.volume=1;v.currentTime=0;v.play();b.hidden=true;};
v.addEventListener('volumechange',()=>{if(!v.muted)b.hidden=true;});
</script>
<p>ai@promr.co.kr · www.promr.blog</p>
</body></html>
